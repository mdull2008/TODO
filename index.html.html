<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач — To-Do List</title>
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключение шрифта Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Плавные анимации и кастомные стили */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-enter {
            animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .shake-error {
            animation: shake 0.35s ease-in-out;
        }

        /* Кастомный скроллбар для списка */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #94a3b8;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-indigo-50/50 to-slate-100 min-h-screen text-slate-800 flex flex-col justify-between py-6 px-4 sm:px-6 lg:px-8 selection:bg-indigo-500 selection:text-white">

    <!-- Основной контейнер -->
    <main class="w-full max-w-xl mx-auto my-auto">
        
        <!-- Карточка приложения -->
        <div class="bg-white/90 backdrop-blur-xl rounded-3xl shadow-[0_20px_50px_rgba(8,_112,_184,_0.07)] border border-slate-200/80 overflow-hidden transition-all duration-300">
            
            <!-- Шапка -->
            <div class="p-6 sm:p-8 pb-6 border-b border-slate-100">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Мои задачи</h1>
                        </div>
                    </div>
                    <span id="current-date" class="text-xs sm:text-sm font-medium text-slate-400 bg-slate-100 px-3 py-1.5 rounded-full"></span>
                </div>
                <p class="text-slate-500 text-sm mt-1">Организуйте свой день просто и эффективно</p>

                <!-- Форма добавления задачи -->
                <form id="todo-form" class="mt-6 relative" novalidate>
                    <div class="flex flex-col sm:flex-row gap-2.5">
                        <div class="relative flex-grow">
                            <input 
                                type="text" 
                                id="todo-input" 
                                placeholder="Что нужно сделать?" 
                                autocomplete="off"
                                class="w-full pl-4 pr-10 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all duration-200 text-base"
                            >
                            <!-- Кнопка очистки поля ввода -->
                            <button 
                                type="button" 
                                id="clear-input-btn" 
                                class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1 rounded-full hover:bg-slate-200/60 transition"
                                title="Очистить поле"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </div>
                        <button 
                            type="submit" 
                            class="px-6 py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-medium rounded-2xl shadow-lg shadow-indigo-600/20 hover:shadow-indigo-600/30 transition-all duration-200 flex items-center justify-center gap-2 shrink-0"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                            </svg>
                            <span>Добавить</span>
                        </button>
                    </div>
                    <!-- Сообщение об ошибке валидации -->
                    <p id="error-msg" class="text-rose-500 text-xs font-medium mt-2 pl-1 hidden transition-opacity duration-200">
                        Пожалуйста, введите название задачи
                    </p>
                </form>
            </div>

            <!-- Панель фильтров и статистики -->
            <div class="px-6 sm:px-8 py-3.5 bg-slate-50/70 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3">
                <!-- Фильтры -->
                <div class="flex items-center bg-slate-200/70 p-1 rounded-xl w-full sm:w-auto justify-center" role="group">
                    <button 
                        type="button" 
                        data-filter="all" 
                        class="filter-btn flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all duration-200 bg-white text-indigo-600 shadow-sm"
                    >
                        Все
                    </button>
                    <button 
                        type="button" 
                        data-filter="active" 
                        class="filter-btn flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all duration-200 text-slate-600 hover:text-slate-900"
                    >
                        Активные
                    </button>
                    <button 
                        type="button" 
                        data-filter="completed" 
                        class="filter-btn flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all duration-200 text-slate-600 hover:text-slate-900"
                    >
                        Выполненные
                    </button>
                </div>

                <!-- Счетчик активных задач -->
                <div class="text-xs sm:text-sm text-slate-500 font-medium w-full sm:w-auto text-center sm:text-right">
                    Осталось задач: <span id="active-count" class="font-bold text-slate-800 bg-slate-200/80 px-2 py-0.5 rounded-md ml-0.5">0</span>
                </div>
            </div>

            <!-- Список задач -->
            <div class="p-6 sm:p-8 pt-4 pb-6">
                <ul id="todo-list" class="space-y-2.5 max-h-[55vh] overflow-y-auto custom-scrollbar pr-1">
                    <!-- Задачи генерируются через JS -->
                </ul>

                <!-- Пустое состояние -->
                <div id="empty-state" class="hidden py-10 text-center">
                    <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                        </svg>
                    </div>
                    <h3 id="empty-title" class="text-slate-700 font-semibold text-base">Список задач пуст</h3>
                    <p id="empty-subtitle" class="text-slate-400 text-sm mt-1">Добавьте свою первую задачу выше</p>
                </div>
            </div>

            <!-- Нижняя панель действий -->
            <div id="footer-actions" class="px-6 sm:px-8 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-xs sm:text-sm hidden">
                <span id="total-completed-text" class="text-slate-400">Выполнено: 0</span>
                <button 
                    type="button" 
                    id="clear-completed-btn" 
                    class="text-rose-600 hover:text-rose-700 font-medium hover:underline flex items-center gap-1.5 transition disabled:opacity-40 disabled:pointer-events-none"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    Очистить выполненные
                </button>
            </div>
        </div>

    </main>

    <!-- Подвал -->
    <footer class="text-center text-slate-400 text-xs mt-8">
        <p>Все данные автоматически сохраняются в вашем браузере (localStorage)</p>
    </footer>

    <!-- Логика приложения -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Ключ для localStorage
            const STORAGE_KEY = 'modern_todo_tasks_v1';

            // Элементы DOM
            const todoForm = document.getElementById('todo-form');
            const todoInput = document.getElementById('todo-input');
            const clearInputBtn = document.getElementById('clear-input-btn');
            const errorMsg = document.getElementById('error-msg');
            const todoList = document.getElementById('todo-list');
            const emptyState = document.getElementById('empty-state');
            const emptyTitle = document.getElementById('empty-title');
            const emptySubtitle = document.getElementById('empty-subtitle');
            const activeCountEl = document.getElementById('active-count');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const footerActions = document.getElementById('footer-actions');
            const clearCompletedBtn = document.getElementById('clear-completed-btn');
            const totalCompletedText = document.getElementById('total-completed-text');
            const currentDateEl = document.getElementById('current-date');

            // Состояние приложения
            let tasks = [];
            let currentFilter = 'all'; // 'all' | 'active' | 'completed'

            // Установка текущей даты
            const setDate = () => {
                const now = new Date();
                const options = { weekday: 'short', day: 'numeric', month: 'long' };
                const formatted = now.toLocaleDateString('ru-RU', options);
                currentDateEl.textContent = formatted.charAt(0).toUpperCase() + formatted.slice(1);
            };

            // Загрузка задач из localStorage
            const loadTasks = () => {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        tasks = JSON.parse(stored);
                    } else {
                        // Приветственные задачи при первом запуске
                        tasks = [
                            { id: '1', text: 'Нажать на задачу, чтобы отметить её выполненной', completed: false, createdAt: Date.now() },
                            { id: '2', text: 'Добавить новую собственную задачу в список', completed: false, createdAt: Date.now() - 1000 },
                            { id: '3', text: 'Проверить сохранение задач после обновления страницы', completed: true, createdAt: Date.now() - 2000 }
                        ];
                        saveTasks();
                    }
                } catch (e) {
                    console.error('Ошибка чтения из localStorage:', e);
                    tasks = [];
                }
            };

            // Сохранение задач в localStorage
            const saveTasks = () => {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
                } catch (e) {
                    console.error('Ошибка сохранения в localStorage:', e);
                }
            };

            // Экранирование HTML для безопасности (защита от XSS)
            const escapeHTML = (str) => {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            };

            // Отображение ошибки валидации
            const showError = () => {
                errorMsg.classList.remove('hidden');
                todoInput.classList.add('border-rose-400', 'bg-rose-50/30', 'shake-error');
                setTimeout(() => {
                    todoInput.classList.remove('shake-error');
                }, 400);
            };

            // Скрытие ошибки валидации
            const hideError = () => {
                errorMsg.classList.add('hidden');
                todoInput.classList.remove('border-rose-400', 'bg-rose-50/30');
            };

            // Добавление новой задачи
            const addTask = (text) => {
                const trimmed = text.trim();
                if (!trimmed) {
                    showError();
                    todoInput.focus();
                    return;
                }

                hideError();

                const newTask = {
                    id: Date.now().toString() + Math.random().toString(36).substring(2, 7),
                    text: trimmed,
                    completed: false,
                    createdAt: Date.now()
                };

                tasks.unshift(newTask); // Добавляем в начало списка
                saveTasks();

                // Если включен фильтр "Выполненные", переключаем на "Все", чтобы пользователь увидел новую задачу
                if (currentFilter === 'completed') {
                    setFilter('all');
                } else {
                    render();
                }

                todoInput.value = '';
                clearInputBtn.classList.add('hidden');
                todoInput.focus();
            };

            // Переключение статуса задачи
            const toggleTask = (id) => {
                tasks = tasks.map(task => 
                    task.id === id ? { ...task, completed: !task.completed } : task
                );
                saveTasks();
                render();
            };

            // Удаление задачи
            const deleteTask = (id) => {
                const taskElement = document.querySelector(`[data-id="${id}"]`);
                if (taskElement) {
                    // Плавная анимация перед удалением
                    taskElement.style.opacity = '0';
                    taskElement.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        tasks = tasks.filter(task => task.id !== id);
                        saveTasks();
                        render();
                    }, 180);
                } else {
                    tasks = tasks.filter(task => task.id !== id);
                    saveTasks();
                    render();
                }
            };

            // Очистка всех выполненных задач
            const clearCompleted = () => {
                tasks = tasks.filter(task => !task.completed);
                saveTasks();
                render();
            };

            // Установка активного фильтра
            const setFilter = (filter) => {
                currentFilter = filter;
                filterBtns.forEach(btn => {
                    if (btn.dataset.filter === filter) {
                        btn.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                        btn.classList.remove('text-slate-600', 'hover:text-slate-900');
                    } else {
                        btn.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                        btn.classList.add('text-slate-600', 'hover:text-slate-900');
                    }
                });
                render();
            };

            // Отрисовка интерфейса
            const render = () => {
                // Фильтрация задач
                const filteredTasks = tasks.filter(task => {
                    if (currentFilter === 'active') return !task.completed;
                    if (currentFilter === 'completed') return task.completed;
                    return true;
                });

                // Подсчет статистики
                const activeCount = tasks.filter(t => !t.completed).length;
                const completedCount = tasks.length - activeCount;

                activeCountEl.textContent = activeCount;
                totalCompletedText.textContent = `Выполнено: ${completedCount} из ${tasks.length}`;

                // Управление видимостью нижней панели
                if (tasks.length > 0) {
                    footerActions.classList.remove('hidden');
                    clearCompletedBtn.disabled = completedCount === 0;
                } else {
                    footerActions.classList.add('hidden');
                }

                // Очистка списка
                todoList.innerHTML = '';

                // Проверка на пустое состояние
                if (filteredTasks.length === 0) {
                    emptyState.classList.remove('hidden');
                    todoList.classList.add('hidden');

                    if (tasks.length === 0) {
                        emptyTitle.textContent = 'Список задач пуст';
                        emptySubtitle.textContent = 'Добавьте свою первую задачу выше';
                    } else if (currentFilter === 'active') {
                        emptyTitle.textContent = 'Нет активных задач';
                        emptySubtitle.textContent = 'Отличная работа! Все задачи выполнены 🎉';
                    } else if (currentFilter === 'completed') {
                        emptyTitle.textContent = 'Нет выполненных задач';
                        emptySubtitle.textContent = 'Отметьте задачу галочкой, когда завершите её';
                    }
                    return;
                }

                emptyState.classList.add('hidden');
                todoList.classList.remove('hidden');

                // Генерация элементов списка
                filteredTasks.forEach(task => {
                    const li = document.createElement('li');
                    li.dataset.id = task.id;
                    li.className = `task-enter group flex items-center justify-between gap-3 p-3.5 sm:p-4 rounded-2xl border transition-all duration-200 ${
                        task.completed 
                            ? 'bg-slate-50/70 border-slate-100 text-slate-400' 
                            : 'bg-white border-slate-200/80 hover:border-indigo-200 hover:shadow-md hover:shadow-indigo-500/5 text-slate-700'
                    }`;

                    li.innerHTML = `
                        <label class="flex items-start sm:items-center gap-3.5 flex-grow cursor-pointer select-none min-w-0 py-0.5">
                            <div class="relative flex items-center justify-center shrink-0 mt-0.5 sm:mt-0">
                                <input 
                                    type="checkbox" 
                                    class="peer sr-only task-checkbox" 
                                    ${task.completed ? 'checked' : ''}
                                >
                                <div class="w-5 h-5 sm:w-6 sm:h-6 rounded-lg border-2 border-slate-300 peer-checked:border-indigo-600 peer-checked:bg-indigo-600 transition-all duration-200 flex items-center justify-center group-hover:border-indigo-400">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 sm:h-4 sm:w-4 text-white transition-transform duration-200 ${task.completed ? 'scale-100' : 'scale-0'}" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                                    </svg>
                                </div>
                            </div>
                            <span class="text-sm sm:text-base break-words leading-snug transition-all duration-200 ${
                                task.completed ? 'line-through text-slate-400' : 'text-slate-700 font-medium'
                            }">
                                ${escapeHTML(task.text)}
                            </span>
                        </label>
                        
                        <button 
                            type="button" 
                            class="delete-btn shrink-0 p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-all duration-150 sm:opacity-0 sm:group-hover:opacity-100 focus:opacity-100"
                            title="Удалить задачу"
                            aria-label="Удалить задачу"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    `;

                    // Событие переключения чекбокса
                    const checkbox = li.querySelector('.task-checkbox');
                    checkbox.addEventListener('change', () => toggleTask(task.id));

                    // Событие удаления задачи
                    const deleteBtn = li.querySelector('.delete-btn');
                    deleteBtn.addEventListener('click', () => deleteTask(task.id));

                    todoList.appendChild(li);
                });
            };

            // Обработчики событий формы и поля ввода
            todoForm.addEventListener('submit', (e) => {
                e.preventDefault();
                addTask(todoInput.value);
            });

            todoInput.addEventListener('input', () => {
                if (todoInput.value.trim().length > 0) {
                    hideError();
                    clearInputBtn.classList.remove('hidden');
                } else {
                    clearInputBtn.classList.add('hidden');
                }
            });

            clearInputBtn.addEventListener('click', () => {
                todoInput.value = '';
                clearInputBtn.classList.add('hidden');
                hideError();
                todoInput.focus();
            });

            // Обработчики кнопок фильтрации
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    setFilter(btn.dataset.filter);
                });
            });

            // Обработчик очистки выполненных
            clearCompletedBtn.addEventListener('click', clearCompleted);

            // Инициализация при запуске
            setDate();
            loadTasks();
            render();
        });
    </script>
</body>
</html>
